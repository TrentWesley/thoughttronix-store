{% extends "base.html" %}

{% block title %}Password reset complete — The ThoughtTronix Store{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <div class="card bg-base-100 shadow-md">
      <div class="card-body">
        <h1 class="card-title text-2xl">Password reset complete</h1>
        <p class="text-sm opacity-70">
          Your new password is set. Sign in with it to pick up where you
          left off.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-4 w-full">Sign in</a>
      </div>
    </div>
  </div>
{% endblock %}
